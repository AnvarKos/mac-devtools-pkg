name: Build macOS pkg

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make postinstall executable
        run: chmod +x scripts/postinstall

      - name: Build component package
        run: |
          pkgbuild \
            --nopayload \
            --scripts scripts \
            --identifier com.frhc.devtools.install \
            --version 1.0 \
            --install-location /tmp \
            Component.pkg

      - name: Build product archive (Intune-compatible)
        run: |
          productbuild \
            --package Component.pkg \
            DevToolsInstall.pkg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevToolsInstall
          path: DevToolsInstall.pkg
