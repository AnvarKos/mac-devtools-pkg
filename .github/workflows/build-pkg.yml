name: Build macOS pkg (combined, all apps)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: |
          chmod +x scripts/preinstall
          chmod +x scripts/postinstall

      - name: Build component package
        run: |
          pkgbuild \
            --nopayload \
            --scripts scripts \
            --identifier com.frhc.devtools.bundle.install \
            --version 1.0 \
            DevToolsBundleInstall.pkg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevToolsBundleInstall
          path: DevToolsBundleInstall.pkg
